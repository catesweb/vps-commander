name: ✨ Feature request
description: Suggest a new feature or improvement for VPS Commander
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. A clear problem statement and a concrete proposal go a long way.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why doesn't the app support it today?
      placeholder: e.g. I manage multiple servers and want to compare their memory usage side-by-side…
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature as concretely as you can — where it would live in the UI, what it would do
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use today, or other tools/approaches you've tried
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Affected area (optional)
      multiple: true
      options:
        - Dashboard / stats
        - Terminal
        - File browser (SFTP)
        - Services / processes / UFW / Docker
        - Logs / audit
        - Multi-server / bulk commands
        - Security / vault
        - Settings / UI polish
        - Packaging / updates / CI
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Note:** this project is single-maintainer. Please don't add AI/Co-Authored-By attribution to your request.
