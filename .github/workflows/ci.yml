name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    # AGENTS.md §8 Repo Policy — never add contributors. Attribution footers
    # (Co-Authored-By:, "Generated with …", AI-tool lines) are banned from
    # commit messages; this job fails the workflow when one sneaks in.
    name: Commit message lint (no attribution)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject attribution footers in commit messages
        shell: bash
        run: |
          set -euo pipefail

          # Inspect only the commits this run introduced:
          #   PR   -> base..head (the PR's commits)
          #   push -> before..HEAD (just pushed); on the first push `before` is
          #           the all-zeros sha, so fall back to full history.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE=""
            else
              RANGE="${BEFORE}..HEAD"
            fi
          fi

          # Banned attribution patterns (tunable — add trailer forms / tool
          # names here as the rule evolves). Matches the full message body,
          # not just the subject line. Trailer phrases are anchored to line
          # starts (the canonical footers always begin a line), while tool
          # names stay unanchored so a stray mid-line mention is still caught.
          # Tool names use a `.` wildcard for one letter so this file does not
          # itself spell out the vendor names it bans.
          BANNED='^co-authored-by:|^co-authored by:|^generated with|^generated by:|c.debuff|c.pilot|🤖'

          # Capture the message bodies first so a broken range surfaces as an
          # error instead of a silent pass (a failed `git log` prints "fatal:
          # bad revision" to stderr while the pipeline would still report
          # grep's exit code).
          MESSAGES="$(git log --format='%H%n%B' ${RANGE:+"$RANGE"})" || {
            echo "::error::git log failed — invalid commit range${RANGE:+ ($RANGE)}. Attribution lint aborted."
            exit 1
          }

          if printf '%s' "$MESSAGES" | grep -iE "$BANNED"; then
            echo "::error::Attribution footer(s) detected in commit message(s). AGENTS.md §8 forbids adding contributors — rewrite the message without Co-Authored-By / 'Generated with' / AI-tool attribution."
            exit 1
          fi
          echo "OK — no attribution footers in commit messages${RANGE:+ ($RANGE)}."

  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check all source files
        run: |
          for f in main.js server.js ssh-handler.js settings.js crypto-util.js app-logger.js scripts/smoke-test.js public/js/app.js; do
            echo "== $f"
            node --check "$f"
          done

  docs:
    name: Docs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify docs TOC anchors and relative links
        run: node scripts/docs-freshness.js

  smoke:
    name: Server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Boot server and verify API endpoints
        run: node scripts/smoke-test.js

  package:
    name: Package check (${{ matrix.os }})
    needs: [check, smoke]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate app icons
        run: npm run icon
      - name: Package (unpacked)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --dir
