name: Links

on:
  schedule:
    # Weekly: Monday 06:00 UTC — external link probing is network-bound and
    # rate-limit sensitive, so it runs on a schedule, not on every push.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    # Manual trigger from the Actions tab — use it after big doc edits.

jobs:
  external-links:
    name: External link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify docs TOC anchors, relative links, and live external links
        run: node scripts/docs-freshness.js --external
